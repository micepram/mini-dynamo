spring:
  application:
    name: dynamo-node
  threads:
    virtual:
      enabled: true
  main:
    banner-mode: off

server:
  port: ${dynamo.admin.port:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

grpc:
  server:
    port: ${dynamo.port:7000}

dynamo:
  port: 7000
  admin-port: 8080
  seeds: ""
  data-dir: ./data
  n: 3
  r: 2
  w: 2
  virtual-nodes: 150
  phi:
    suspect-threshold: 8.0
    down-threshold: 12.0
  gossip:
    interval-ms: 1000
    fanout: 3
  antientropy:
    interval-ms: 30000
  hint:
    replay-interval-ms: 5000
  clock:
    prune-threshold: 10
  reconciler: lww

logging:
  level:
    root: INFO
    io.minidynamo: DEBUG
